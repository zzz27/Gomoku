<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4eb">
<title>五子棋 · 好友对弈</title>
<link rel="stylesheet" href="style.css?v=4">
<script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script defer src="game.js?v=4"></script>
</head>
<body>
<main>
  <header><span class="mark" aria-hidden="true">●<i>●</i></span><span>好友对弈</span></header>
  <div class="layout">
    <section class="controls">
      <h1>五子棋</h1>
      <p class="intro">黑棋先手，横、竖或斜着连成五子即获胜。</p>
      <div class="panel">
        <div id="lobby">
          <button id="create" class="primary">创建房间</button>
          <form id="join">
            <label for="code">已有房间码？</label>
            <div class="row"><input id="code" placeholder="输入 4 位数字" maxlength="4" minlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="off" spellcheck="false" required><button>加入</button></div>
          </form>
        </div>
        <div id="room" hidden>
          <div class="room-label">房间码 <strong id="room-code"></strong></div>
          <button id="share" class="primary">复制邀请链接</button>
          <div id="fallback" hidden><label for="invite">邀请链接</label><input id="invite" readonly></div>
          <p id="copy-status" role="status" hidden></p>
          <div class="row actions"><button id="again" hidden>再来一局</button><button id="leave">离开房间</button></div>
        </div>
      </div>
    </section>
    <section class="play" aria-label="对局">
      <div class="game-status"><span id="turn-stone" class="stone black" aria-hidden="true"></span><span id="status" role="status">创建或加入房间开始对弈</span></div>
      <div class="frame">
        <div id="board" role="group" aria-label="十五路棋盘，可用方向键移动，回车落子">
          <div class="stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <div id="points"></div>
        </div>
      </div>
      <div class="caption"><span id="side">15 × 15</span><span id="count">0 手</span></div>
    </section>
  </div>
</main>
<div id="loss-overlay" hidden role="status" aria-label="你输了"><span aria-hidden="true">菜</span></div>
</body>
</html>
